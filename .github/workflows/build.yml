name: Build installer

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    tags: ["v*"]            # atau push tag, mis. v0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Hanzi-Overlay-Windows
          path: |
            dist/*.exe
      - name: Lampirkan ke GitHub Release (jika dari tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hanzi Overlay ${{ github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
          body: |
            Aplikasi desktop Windows yang menampilkan pinyin dan terjemahan dari teks Mandarin.

            **Cara pakai**
            - Blok teks Mandarin lalu tekan `Ctrl+Alt+H`
            - Teks di gambar: tekan `Ctrl+Alt+J` lalu tarik kotak
            - Keluar: `Ctrl+Alt+Q`

            **Unduh**
            - `Hanzi-Overlay-Setup-*.exe`: installer dengan shortcut (disarankan)
            - `Hanzi-Overlay-Portable-*.exe`: tanpa instal

            **Catatan**
            - Windows mungkin menampilkan "Windows protected your PC" karena aplikasi belum ditandatangani. Klik **More info**, lalu **Run anyway**.
            - Antivirus kadang salah menandai karena aplikasi menyalin teks otomatis lewat PowerShell. Kode sumbernya terbuka di repo ini.
            - Perlu internet untuk terjemahan dan untuk mengunduh data OCR saat pertama kali dipakai.
